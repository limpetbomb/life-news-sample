<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ライフニュース 原稿自動生成ツール 試作版</title>
  <style>
    :root {
      --ink: #202725;
      --muted: #66716d;
      --paper: #f7f5ef;
      --panel: #fffdf9;
      --line: #d8d1c2;
      --green: #266b57;
      --green-dark: #174b3c;
      --gold: #b47b2b;
      --blue: #2c6685;
      --red: #a44942;
      --shadow: 0 8px 22px rgba(42, 48, 44, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      letter-spacing: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, transparent 1px),
        linear-gradient(#fffdf8, var(--paper));
      background-size: 24px 24px, auto;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: #fff;
      border-radius: 8px;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.25;
    }

    .lead {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 440px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 253, 249, .94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fffefa;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
    }

    .form {
      padding: 14px 16px 16px;
      display: grid;
      gap: 12px;
      max-height: calc(100vh - 150px);
      overflow: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field.full { grid-column: 1 / -1; }

    label {
      display: block;
      color: #3d473f;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfc7b6;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input,
    select {
      height: 40px;
      padding: 0 10px;
    }

    textarea {
      min-height: 74px;
      padding: 9px 10px;
      resize: vertical;
      line-height: 1.5;
    }

    .btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--green);
      border-radius: 7px;
      background: var(--green);
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn.secondary {
      background: #fff;
      color: var(--green);
    }

    .btn.warn {
      background: #fff;
      color: var(--red);
      border-color: #c88f8b;
    }

    .sample-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .results {
      padding: 14px 16px 16px;
      display: grid;
      gap: 12px;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #eee7dc;
      background: #f8f1e3;
    }

    .result-head strong {
      font-size: 14px;
    }

    .result-card textarea {
      min-height: 82px;
      border: 0;
      border-radius: 0;
      background: #fff;
      padding: 12px;
      line-height: 1.75;
      font-size: 14px;
    }

    .result-card.large textarea {
      min-height: 230px;
    }

    .notes {
      border: 1px solid #ead0a3;
      border-radius: 8px;
      background: #fff8e8;
      padding: 12px;
      color: #6f4f18;
      font-size: 13px;
      line-height: 1.65;
      font-weight: 800;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
      font-weight: 800;
      line-height: 1.7;
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .form { max-height: none; }
      .top { display: grid; }
    }

    @media (max-width: 640px) {
      .app { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark">LIFE<br>NEWS</div>
        <div>
          <h1>ライフニュース 原稿自動生成ツール</h1>
          <p class="lead">企業情報から、Web記事・SNS投稿・紙面用短文を分けて生成するローカル試作版です。入力にない内容は作りすぎず、必要に応じて要確認を表示します。</p>
        </div>
      </div>
      <div class="btns">
        <button class="btn secondary" id="exportJson" type="button">JSON出力</button>
        <button class="btn secondary" id="exportCsv" type="button">CSV出力</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>入力フォーム</h2>
          <span class="lead">社内確認用</span>
        </div>
        <form class="form" id="generatorForm">
          <div class="sample-row">
            <label for="sampleSelect">サンプル入力データ</label>
            <select id="sampleSelect">
              <option value="">選択してください</option>
              <option value="0">みどりマート / 食材、スーパー</option>
              <option value="1">まごころ惣菜便 / 惣菜、宅配</option>
              <option value="2">青葉薬局 健康相談室 / 健康相談</option>
            </select>
          </div>

          <div class="grid">
            <div class="field">
              <label for="feature">特集名</label>
              <input id="feature" placeholder="例: 夏の食卓応援特集">
            </div>
            <div class="field">
              <label for="issue">掲載号</label>
              <input id="issue" placeholder="例: 2026年7月号">
            </div>
            <div class="field">
              <label for="category">カテゴリ</label>
              <select id="category">
                <option>食材、スーパー</option>
                <option>惣菜、宅配</option>
                <option>健康相談</option>
                <option>レシピ、料理教室</option>
                <option>飲食店</option>
                <option>健康サポート</option>
              </select>
            </div>
            <div class="field">
              <label for="tone">文章のトーン</label>
              <select id="tone">
                <option>親しみやすい</option>
                <option>信頼感</option>
                <option>上品</option>
                <option>元気</option>
                <option>専門的</option>
              </select>
            </div>
            <div class="field">
              <label for="companyName">企業名</label>
              <input id="companyName" placeholder="例: みどりマート">
            </div>
            <div class="field">
              <label for="industry">業種</label>
              <input id="industry" placeholder="例: 地域密着スーパー">
            </div>
            <div class="field full">
              <label for="products">販売商品、サービス名</label>
              <input id="products" placeholder="例: 地場野菜、日替わり惣菜、宅配相談">
            </div>
            <div class="field full">
              <label for="serviceDetail">サービス内容</label>
              <textarea id="serviceDetail" placeholder="具体的な内容、利用方法、相談できること"></textarea>
            </div>
            <div class="field full">
              <label for="strength">強み、特徴</label>
              <textarea id="strength" placeholder="例: 地場野菜が多い、電話注文可、薬剤師に相談できる"></textarea>
            </div>
            <div class="field">
              <label for="target">対象顧客</label>
              <input id="target" placeholder="例: 40代〜60代の家庭、シニア世帯">
            </div>
            <div class="field">
              <label for="price">価格帯</label>
              <input id="price" placeholder="例: 日替わり弁当700円前後">
            </div>
            <div class="field">
              <label for="area">対応エリア</label>
              <input id="area" placeholder="例: 新潟市中央区周辺">
            </div>
            <div class="field">
              <label for="phone">電話番号</label>
              <input id="phone" placeholder="例: 025-000-0000">
            </div>
            <div class="field full">
              <label for="address">住所</label>
              <input id="address" placeholder="例: 新潟市中央区...">
            </div>
            <div class="field full">
              <label for="website">WebサイトURL</label>
              <input id="website" placeholder="https://example.com">
            </div>
            <div class="field full">
              <label for="campaign">キャンペーン情報</label>
              <textarea id="campaign" placeholder="例: 7月末まで惣菜3点購入で50円引き"></textarea>
            </div>
            <div class="field full">
              <label for="outputType">生成したい文章タイプ</label>
              <select id="outputType">
                <option>一式すべて</option>
                <option>Web記事</option>
                <option>SNS投稿</option>
                <option>紙面用キャッチコピー</option>
                <option>短い紹介文</option>
                <option>長めの紹介文</option>
              </select>
            </div>
          </div>

          <div class="btns">
            <button class="btn" type="submit">文章を生成</button>
            <button class="btn secondary" id="clearButton" type="button">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>生成結果</h2>
          <div class="btns">
            <button class="btn secondary" id="copyAll" type="button">すべてコピー</button>
          </div>
        </div>
        <div class="results" id="results">
          <div class="empty">入力して「文章を生成」を押すと、紙面・Web・SNS向けの文章案が表示されます。</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const samples = [
      {
        feature: "夏の食卓応援特集", issue: "2026年7月号", category: "食材、スーパー", tone: "親しみやすい",
        companyName: "みどりマート", industry: "地域密着スーパー", products: "地場野菜、精肉、鮮魚、日替わり惣菜",
        serviceDetail: "旬の地場野菜や日替わり惣菜を販売。夕方の買い物にも立ち寄りやすく、電話での取り置き相談にも対応しています。",
        strength: "地場野菜の品ぞろえ、日替わり惣菜、地域に根ざした接客",
        target: "毎日の食材を手軽にそろえたい家庭、40代〜60代の読者",
        price: "惣菜は300円台から", area: "新潟市中央区周辺",
        address: "新潟市中央区緑町1-2-3", phone: "025-000-1122", website: "https://example.com/midori",
        campaign: "週末は地場野菜コーナーを拡大予定"
      },
      {
        feature: "夏の食卓応援特集", issue: "2026年7月号", category: "惣菜、宅配", tone: "信頼感",
        companyName: "まごころ惣菜便", industry: "惣菜宅配", products: "日替わり惣菜、弁当宅配、週替わり献立",
        serviceDetail: "共働き世帯やシニア世帯に向けて、日替わり惣菜と弁当を配達。電話注文にも対応しています。",
        strength: "電話注文可、日替わり献立、配達相談に対応",
        target: "買い物や調理の負担を減らしたい家庭、シニア世帯",
        price: "弁当700円前後", area: "新潟市東区・中央区の一部",
        address: "新潟市東区朝日町4-5-6", phone: "025-000-3344", website: "",
        campaign: "初回注文時に配達エリアを確認"
      },
      {
        feature: "夏の健康相談特集", issue: "2026年7月号", category: "健康相談", tone: "専門的",
        companyName: "青葉薬局 健康相談室", industry: "薬局 / 健康相談", products: "健康測定、服薬相談、栄養相談",
        serviceDetail: "地域のかかりつけ薬局として、栄養、服薬、健康測定の相談を受け付けています。",
        strength: "薬剤師による相談、健康測定、予約相談",
        target: "体調管理や服薬について相談したい方",
        price: "相談内容により異なる", area: "新潟市西区周辺",
        address: "新潟市西区青葉台2-8-1", phone: "025-000-5566", website: "https://example.com/aoba",
        campaign: "相談前に電話予約を推奨"
      }
    ];

    const fieldIds = ["feature", "issue", "category", "tone", "companyName", "industry", "products", "serviceDetail", "strength", "target", "price", "area", "address", "phone", "website", "campaign", "outputType"];
    let lastOutput = null;

    function v(id) {
      return document.getElementById(id).value.trim();
    }

    function setForm(data) {
      fieldIds.forEach(id => {
        if (id === "outputType") return;
        if (data[id] !== undefined) document.getElementById(id).value = data[id];
      });
    }

    function sentenceJoin(parts) {
      return parts.filter(Boolean).join("。") + "。";
    }

    function isSensitive(category, industry, products) {
      const text = `${category} ${industry} ${products}`;
      return /(医療|健康|薬局|保険|法律|相続|司法書士|税理士|介護|年金)/.test(text);
    }

    function toneLead(tone) {
      return {
        "親しみやすい": "気軽に相談しやすい",
        "信頼感": "地域で安心して相談できる",
        "上品": "落ち着いた暮らしに寄り添う",
        "元気": "毎日を前向きに支える",
        "専門的": "専門知識をもとに相談を受け付ける"
      }[tone] || "地域に寄り添う";
    }

    function warnings(data) {
      const list = [];
      ["companyName", "products", "serviceDetail", "phone"].forEach(id => {
        if (!data[id]) list.push(`要確認: ${labelMap[id]}が未入力です。`);
      });
      if (isSensitive(data.category, data.industry, data.products)) {
        list.push("要確認: 医療・健康・保険・法律・相続に関わる内容は、効果や結果を断定しない表現にしています。公開前に専門表現を確認してください。");
      }
      if (!data.price) list.push("要確認: 価格帯が未入力のため、価格に関する表現は入れていません。");
      if (!data.website) list.push("要確認: WebサイトURLが未入力です。QR誘導先は電話問い合わせ中心の表現にしています。");
      return list;
    }

    const labelMap = {
      companyName: "企業名",
      products: "販売商品、サービス名",
      serviceDetail: "サービス内容",
      phone: "電話番号"
    };

    function generate(data) {
      const sensitive = isSensitive(data.category, data.industry, data.products);
      const lead = toneLead(data.tone);
      const product = data.products || "サービス内容";
      const target = data.target ? `${data.target}に向けて` : "";
      const area = data.area ? `${data.area}で` : "";
      const price = data.price ? `価格帯は${data.price}です。` : "";
      const campaign = data.campaign ? `現在の案内: ${data.campaign}。` : "";
      const consult = sensitive ? "相談内容により案内が異なるため、詳細は事前にお問い合わせください。" : "詳しい内容は店舗・窓口へお問い合わせください。";
      const websiteLine = data.website ? `詳しくはWebサイト（${data.website}）でも確認できます。` : "詳しくは電話でお問い合わせください。";

      const catchCopyBase = data.products
        ? `${product.split(/[、,]/)[0]}を、身近に相談`
        : `${data.companyName || "掲載企業"}に相談`;
      const catchCopy = trimText(catchCopyBase, 30);

      const shortIntro = trimText(sentenceJoin([
        `${data.companyName || "掲載企業"}は${area}${product}を扱う${data.industry || data.category || "企業"}です`,
        data.strength ? `${data.strength}が特徴です` : "",
        data.phone ? `問い合わせは${data.phone}へ` : ""
      ]), 80);

      const title = `${data.companyName || "掲載企業"}｜${data.feature || data.category || "ライフニュース特集"}掲載情報`;

      const webBody = [
        `${data.companyName || "掲載企業"}は、${area}${product}を扱う${data.industry || data.category || "地域の企業"}です。`,
        data.serviceDetail ? `${data.serviceDetail}` : "具体的なサービス内容は、登録情報の追記が必要です。",
        data.strength ? `特徴は、${data.strength}。` : "強みや特徴は未入力のため、公開前に追記してください。",
        target ? `${target}、${lead}案内を行っています。` : `${lead}案内を行っています。`,
        price,
        campaign,
        data.address ? `所在地は${data.address}です。` : "",
        data.phone ? `問い合わせは${data.phone}へ。` : "問い合わせ先電話番号は要確認です。",
        websiteLine,
        consult,
        data.issue || data.feature ? `本情報は「${data.issue || "掲載号未設定"}」の「${data.feature || "特集名未設定"}」掲載用データをもとに作成しています。` : ""
      ].filter(Boolean).join("\n\n");

      const sns = trimText([
        `${data.feature ? `【${data.feature}】` : "【ライフニュース掲載情報】"}`,
        `${data.companyName || "掲載企業"}では、${product}について相談・確認できます。`,
        data.strength ? `特徴: ${data.strength}。` : "",
        data.phone ? `お問い合わせ: ${data.phone}` : "お問い合わせ先は要確認です。"
      ].filter(Boolean).join("\n"), 180);

      const hashtags = makeHashtags(data);
      const qr = data.website
        ? `紙面のQRコードから、${data.companyName || "掲載企業"}の詳しい情報・問い合わせ先をご確認ください。`
        : `紙面のQRコードまたはお電話で、${data.companyName || "掲載企業"}の詳しい情報をご確認ください。`;
      const sales = `${data.companyName || "掲載企業"}は、${data.category || "対象カテゴリ"}枠で${product}の具体性を打ち出せる掲載先です。${data.target ? `${data.target}への訴求に向いています。` : "対象顧客の追記により、提案精度を高められます。"}紙面では短い導入、Webではサービス内容・問い合わせ先を補足する構成が提案しやすいです。`;

      return {
        catchCopy,
        shortIntro,
        webTitle: title,
        webBody,
        sns,
        hashtags,
        qr,
        sales,
        warnings: warnings(data)
      };
    }

    function trimText(text, max) {
      if (text.length <= max) return text;
      return text.slice(0, max - 1) + "…";
    }

    function makeHashtags(data) {
      const tags = ["#ライフニュース"];
      if (data.category) tags.push(`#${data.category.replace(/[、\s]/g, "")}`);
      if (data.feature) tags.push(`#${data.feature.replace(/\s/g, "")}`);
      if (data.area) tags.push(`#${data.area.replace(/[、\s]/g, "")}`);
      if (data.products) tags.push(`#${data.products.split(/[、,]/)[0].replace(/\s/g, "")}`);
      return tags.slice(0, 6).join(" ");
    }

    function collect() {
      return Object.fromEntries(fieldIds.map(id => [id, v(id)]));
    }

    function render(outputs) {
      lastOutput = outputs;
      const cards = [
        ["紙面用キャッチコピー", "catchCopy"],
        ["紙面用短文紹介", "shortIntro"],
        ["Web記事タイトル", "webTitle"],
        ["Web記事本文", "webBody", "large"],
        ["SNS投稿文", "sns"],
        ["ハッシュタグ案", "hashtags"],
        ["QR誘導文", "qr"],
        ["営業提案用の説明文", "sales"]
      ].map(([title, key, size]) => `
        <article class="result-card ${size || ""}">
          <div class="result-head"><strong>${title}</strong><button class="btn secondary copy-one" type="button" data-key="${key}">コピー</button></div>
          <textarea id="out-${key}">${outputs[key]}</textarea>
        </article>
      `).join("");
      const note = outputs.warnings.length
        ? `<div class="notes">${outputs.warnings.map(item => `<div>${item}</div>`).join("")}</div>`
        : `<div class="notes">要確認事項はありません。ただし公開前に企業情報、価格、連絡先、法務・医療・保険関連表現を確認してください。</div>`;
      document.getElementById("results").innerHTML = note + cards;
    }

    function download(filename, text, type) {
      const blob = new Blob([text], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("generatorForm").addEventListener("submit", event => {
      event.preventDefault();
      render(generate(collect()));
    });

    document.getElementById("sampleSelect").addEventListener("change", event => {
      const sample = samples[Number(event.target.value)];
      if (sample) setForm(sample);
    });

    document.getElementById("clearButton").addEventListener("click", () => {
      document.getElementById("generatorForm").reset();
      document.getElementById("results").innerHTML = '<div class="empty">入力して「文章を生成」を押すと、紙面・Web・SNS向けの文章案が表示されます。</div>';
      lastOutput = null;
    });

    document.getElementById("results").addEventListener("click", async event => {
      const button = event.target.closest(".copy-one");
      if (!button || !lastOutput) return;
      const value = lastOutput[button.dataset.key] || "";
      await navigator.clipboard.writeText(value);
      button.textContent = "コピー済み";
      setTimeout(() => button.textContent = "コピー", 1200);
    });

    document.getElementById("copyAll").addEventListener("click", async () => {
      if (!lastOutput) return;
      const text = Object.entries(lastOutput)
        .filter(([key]) => key !== "warnings")
        .map(([key, value]) => `${key}\n${value}`)
        .join("\n\n");
      await navigator.clipboard.writeText(text);
    });

    document.getElementById("exportJson").addEventListener("click", () => {
      const payload = { input: collect(), output: lastOutput || generate(collect()) };
      download(`life-news-copy-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
    });

    document.getElementById("exportCsv").addEventListener("click", () => {
      const output = lastOutput || generate(collect());
      const rows = [
        ["type", "text"],
        ["paper_catchcopy", output.catchCopy],
        ["paper_short_intro", output.shortIntro],
        ["web_title", output.webTitle],
        ["web_body", output.webBody],
        ["sns", output.sns],
        ["hashtags", output.hashtags],
        ["qr", output.qr],
        ["sales", output.sales],
        ["warnings", output.warnings.join(" / ")]
      ];
      const csv = "\ufeff" + rows.map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(",")).join("\n");
      download(`life-news-copy-${new Date().toISOString().slice(0, 10)}.csv`, csv, "text/csv;charset=utf-8");
    });
  </script>
</body>
</html>
