<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ライフニュース 掲載企業DB 試作管理画面</title>
  <style>
    :root {
      --ink: #202725;
      --muted: #66716d;
      --paper: #f7f5ef;
      --panel: #fffdf9;
      --line: #d8d1c2;
      --green: #266b57;
      --green-dark: #174b3c;
      --gold: #b47b2b;
      --blue: #2c6685;
      --red: #a44942;
      --shadow: 0 8px 22px rgba(42, 48, 44, .08);
    }

    * { box-sizing: border-box; }

    html { background: #ddd9cf; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      letter-spacing: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,.5) 0 1px, transparent 1px),
        linear-gradient(#fffdf8, var(--paper));
      background-size: 24px 24px, auto;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
    }

    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--green), var(--blue));
      color: #fff;
      border-radius: 8px;
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.25;
    }

    .lead {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--green);
      border-radius: 7px;
      background: var(--green);
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn.secondary {
      background: #fff;
      color: var(--green);
    }

    .btn.warn {
      background: #fff;
      color: var(--red);
      border-color: #c88f8b;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255, 253, 249, .94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: #fffefa;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      line-height: 1.25;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: #fbf8ef;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfc7b6;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input,
    select {
      height: 40px;
      padding: 0 10px;
    }

    textarea {
      min-height: 76px;
      padding: 9px 10px;
      resize: vertical;
      line-height: 1.5;
    }

    .table-wrap {
      overflow: auto;
      max-height: 620px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      background: #fff;
    }

    th,
    td {
      padding: 10px 9px;
      border-bottom: 1px solid #eee7dc;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
      line-height: 1.45;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f2ead9;
      color: #4b513d;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .name-cell strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      background: #e7f0ea;
      color: var(--green-dark);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini {
      min-height: 30px;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
    }

    .form {
      padding: 14px 16px 16px;
      display: grid;
      gap: 13px;
      max-height: 860px;
      overflow: auto;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      color: #3d473f;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .help {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      font-weight: 700;
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 4px;
    }

    .preview {
      display: none;
      padding: 18px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .preview.open { display: block; }

    .article {
      border: 1px solid var(--line);
      border-radius: 9px;
      overflow: hidden;
      background: #fffefa;
    }

    .article-image {
      height: 180px;
      background:
        linear-gradient(135deg, #e9d9bf 0 42%, #fff 42% 58%, #dbe8df 58%);
      display: grid;
      place-items: center;
      color: #6a715f;
      font-weight: 900;
      text-align: center;
      padding: 16px;
    }

    .article-body {
      padding: 18px;
    }

    .article h3 {
      margin: 8px 0 8px;
      font-size: 26px;
      line-height: 1.25;
    }

    .article p {
      margin: 0 0 12px;
      color: #38433f;
      font-size: 14px;
      line-height: 1.75;
      font-weight: 750;
    }

    .article dl {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px 12px;
      margin: 14px 0 0;
      padding: 14px 0 0;
      border-top: 1px solid #eadfcd;
      font-size: 13px;
      line-height: 1.5;
    }

    .article dt {
      color: var(--muted);
      font-weight: 900;
    }

    .article dd {
      margin: 0;
      font-weight: 800;
    }

    .notice {
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      background: #f7f1e4;
      color: #6a5a34;
      font-size: 12px;
      line-height: 1.55;
      font-weight: 800;
    }

    @media (max-width: 980px) {
      .layout,
      .filters {
        grid-template-columns: 1fr;
      }

      .top {
        display: grid;
      }

      .toolbar {
        justify-content: flex-start;
      }
    }

    @media (max-width: 640px) {
      .app { padding: 14px; }
      .form-grid { grid-template-columns: 1fr; }
      .article dl { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark">LIFE<br>NEWS</div>
        <div>
          <h1>ライフニュース 掲載企業DB</h1>
          <p class="lead">営業が登録した企業情報を、紙面原稿・Web記事・掲載企業一覧に共通利用するためのローカル試作管理画面です。</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="btn" id="newButton" type="button">新規登録</button>
        <button class="btn secondary" id="exportButton" type="button">CSV出力</button>
        <button class="btn secondary" id="sampleButton" type="button">サンプル復元</button>
      </div>
    </header>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <h2>掲載企業一覧</h2>
          <span class="count" id="recordCount">0件</span>
        </div>
        <div class="filters">
          <input id="searchInput" type="search" placeholder="企業名・担当営業・住所・業種で検索">
          <select id="categoryFilter" aria-label="カテゴリで絞り込み"></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>掲載号</th>
                <th>カテゴリ</th>
                <th>企業名 / 業種</th>
                <th>担当営業</th>
                <th>紙面枠</th>
                <th>電話番号</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="recordRows"></tbody>
          </table>
        </div>
        <div class="notice">保存先はこのブラウザのローカル保存領域です。別PCや別ブラウザとは共有されません。CSV出力で外部管理ツールへ移行できます。</div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <h2 id="formTitle">新規登録フォーム</h2>
          <span class="count" id="editState">新規</span>
        </div>
        <form class="form" id="companyForm">
          <input type="hidden" id="id">
          <div class="form-grid">
            <div class="field">
              <label for="issue">掲載号</label>
              <input id="issue" required placeholder="例: 2026年7月号">
            </div>
            <div class="field">
              <label for="feature">特集名</label>
              <input id="feature" required placeholder="例: 夏の食卓応援特集">
            </div>
            <div class="field">
              <label for="category">カテゴリ</label>
              <select id="category" required></select>
            </div>
            <div class="field">
              <label for="industry">業種</label>
              <input id="industry" placeholder="例: スーパー / 惣菜店">
            </div>
            <div class="field full">
              <label for="companyName">企業名</label>
              <input id="companyName" required placeholder="例: みどりマート">
            </div>
            <div class="field">
              <label for="salesPerson">担当営業</label>
              <input id="salesPerson" placeholder="例: 佐藤">
            </div>
            <div class="field">
              <label for="adSize">紙面掲載枠サイズ</label>
              <input id="adSize" placeholder="例: 1/8枠 / 小枠">
            </div>
            <div class="field full">
              <label for="catchCopy">キャッチコピー</label>
              <input id="catchCopy" placeholder="例: 地元野菜で、毎日の食卓をもっと楽しく。">
            </div>
            <div class="field full">
              <label for="description">紹介文</label>
              <textarea id="description" placeholder="企業紹介、地域性、読者へのメッセージ"></textarea>
            </div>
            <div class="field full">
              <label for="services">商品、サービス内容</label>
              <textarea id="services" placeholder="主な商品・サービス・キャンペーン内容"></textarea>
            </div>
            <div class="field full">
              <label for="address">住所</label>
              <input id="address" placeholder="例: 新潟市中央区...">
            </div>
            <div class="field">
              <label for="phone">電話番号</label>
              <input id="phone" placeholder="例: 025-000-0000">
            </div>
            <div class="field">
              <label for="website">WebサイトURL</label>
              <input id="website" placeholder="https://example.com">
            </div>
            <div class="field full">
              <label for="imageUrl">画像URL</label>
              <input id="imageUrl" placeholder="https://example.com/photo.jpg">
              <p class="help">未入力の場合は仮の画像エリアを表示します。</p>
            </div>
            <div class="field full">
              <label for="qrUrl">QRリンク先URL</label>
              <input id="qrUrl" placeholder="https://example.com/life-news">
            </div>
            <div class="field full">
              <label for="notes">備考</label>
              <textarea id="notes" placeholder="制作向け注意事項、確認状況、掲載条件など"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">保存する</button>
            <button class="btn secondary" id="previewButton" type="button">プレビュー表示</button>
            <button class="btn secondary" id="clearButton" type="button">入力をクリア</button>
            <button class="btn warn" id="deleteButton" type="button">削除</button>
          </div>
        </form>
        <div class="preview" id="previewPanel"></div>
      </aside>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "lifeNewsCompanyDbPrototype.v2";
    const categories = ["食材、スーパー", "惣菜、宅配", "健康相談", "レシピ、料理教室", "飲食店", "健康サポート"];
    const fields = [
      "id", "issue", "feature", "category", "companyName", "industry", "salesPerson",
      "catchCopy", "description", "services", "address", "phone", "website",
      "imageUrl", "qrUrl", "adSize", "notes"
    ];

    const samples = [
      {
        id: crypto.randomUUID(), issue: "2026年7月号", feature: "夏の食卓応援特集", category: "食材、スーパー",
        companyName: "みどりマート", industry: "地域密着スーパー", salesPerson: "佐藤",
        catchCopy: "地元野菜で、毎日の食卓をもっと楽しく。",
        description: "旬の地場野菜や精肉、惣菜を扱う地域密着スーパー。夕方の買い物にも立ち寄りやすい店舗です。",
        services: "地場野菜、精肉、鮮魚、日替わり惣菜、宅配相談",
        address: "新潟市中央区緑町1-2-3", phone: "025-000-1122", website: "https://example.com/midori",
        imageUrl: "", qrUrl: "https://example.com/midori/life-news", adSize: "1/4枠", notes: "写真は店頭外観と惣菜売場を希望"
      },
      {
        id: crypto.randomUUID(), issue: "2026年7月号", feature: "夏の食卓応援特集", category: "惣菜、宅配",
        companyName: "まごころ惣菜便", industry: "惣菜宅配", salesPerson: "田中",
        catchCopy: "できたて惣菜を、夕方の食卓へ。",
        description: "共働き世帯やシニア世帯に向けて、日替わり惣菜と弁当を配達。電話注文にも対応しています。",
        services: "日替わり惣菜、弁当宅配、週替わり献立、電話注文",
        address: "新潟市東区朝日町4-5-6", phone: "025-000-3344", website: "",
        imageUrl: "", qrUrl: "https://example.com/souzai", adSize: "1/8枠", notes: "宅配エリア注記あり"
      },
      {
        id: crypto.randomUUID(), issue: "2026年7月号", feature: "夏の食卓応援特集", category: "健康相談",
        companyName: "青葉薬局 健康相談室", industry: "薬局 / 健康相談", salesPerson: "鈴木",
        catchCopy: "食事と体調のこと、薬剤師に相談できます。",
        description: "地域のかかりつけ薬局として、栄養、服薬、健康測定の相談を受け付けています。",
        services: "健康測定、服薬相談、栄養相談、オンライン相談予約",
        address: "新潟市西区青葉台2-8-1", phone: "025-000-5566", website: "https://example.com/aoba",
        imageUrl: "", qrUrl: "https://example.com/aoba/consult", adSize: "小枠", notes: "医療表現に注意"
      }
    ];

    let records = loadRecords();

    const form = document.getElementById("companyForm");
    const rows = document.getElementById("recordRows");
    const recordCount = document.getElementById("recordCount");
    const categoryFilter = document.getElementById("categoryFilter");
    const categorySelect = document.getElementById("category");
    const searchInput = document.getElementById("searchInput");
    const previewPanel = document.getElementById("previewPanel");
    const formTitle = document.getElementById("formTitle");
    const editState = document.getElementById("editState");

    function loadRecords() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return samples;
      try {
        const parsed = JSON.parse(saved);
        return Array.isArray(parsed) ? parsed : samples;
      } catch {
        return samples;
      }
    }

    function saveRecords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
      }[char]));
    }

    function fillSelects() {
      categorySelect.innerHTML = categories.map(category => `<option value="${category}">${category}</option>`).join("");
      categoryFilter.innerHTML = `<option value="">すべてのカテゴリ</option>` + categories.map(category => `<option value="${category}">${category}</option>`).join("");
    }

    function getFormRecord() {
      const record = {};
      fields.forEach(field => {
        const element = document.getElementById(field);
        record[field] = element ? element.value.trim() : "";
      });
      record.id = record.id || crypto.randomUUID();
      return record;
    }

    function setFormRecord(record) {
      fields.forEach(field => {
        const element = document.getElementById(field);
        if (element) element.value = record?.[field] || "";
      });
      formTitle.textContent = record?.id ? "編集画面" : "新規登録フォーム";
      editState.textContent = record?.id ? "編集中" : "新規";
      previewPanel.classList.remove("open");
    }

    function clearForm() {
      setFormRecord({ category: categories[0] });
      document.getElementById("issue").value = "2026年7月号";
      document.getElementById("feature").value = "夏の食卓応援特集";
    }

    function filteredRecords() {
      const category = categoryFilter.value;
      const query = searchInput.value.trim().toLowerCase();
      return records.filter(record => {
        const categoryMatch = !category || record.category === category;
        const haystack = [record.companyName, record.industry, record.salesPerson, record.address, record.feature, record.issue].join(" ").toLowerCase();
        return categoryMatch && haystack.includes(query);
      });
    }

    function renderRows() {
      const filtered = filteredRecords();
      recordCount.textContent = `${filtered.length}件 / 全${records.length}件`;
      rows.innerHTML = filtered.map(record => `
        <tr>
          <td>${escapeHtml(record.issue)}<br><small>${escapeHtml(record.feature)}</small></td>
          <td><span class="tag">${escapeHtml(record.category)}</span></td>
          <td class="name-cell"><strong>${escapeHtml(record.companyName)}</strong>${escapeHtml(record.industry)}</td>
          <td>${escapeHtml(record.salesPerson)}</td>
          <td>${escapeHtml(record.adSize)}</td>
          <td>${escapeHtml(record.phone)}</td>
          <td>
            <div class="row-actions">
              <button class="btn mini" type="button" data-action="edit" data-id="${record.id}">編集</button>
              <button class="btn secondary mini" type="button" data-action="preview" data-id="${record.id}">プレビュー</button>
              <button class="btn warn mini" type="button" data-action="delete" data-id="${record.id}">削除</button>
            </div>
          </td>
        </tr>
      `).join("");
    }

    function renderPreview(record) {
      const imageBlock = record.imageUrl
        ? `<img src="${escapeHtml(record.imageUrl)}" alt="${escapeHtml(record.companyName)}" style="width:100%;height:100%;object-fit:cover;">`
        : `<span>画像URL未設定<br>${escapeHtml(record.category)}</span>`;
      previewPanel.innerHTML = `
        <article class="article">
          <div class="article-image">${imageBlock}</div>
          <div class="article-body">
            <span class="tag">${escapeHtml(record.category)}</span>
            <h3>${escapeHtml(record.companyName)}</h3>
            <p><strong>${escapeHtml(record.catchCopy)}</strong></p>
            <p>${escapeHtml(record.description)}</p>
            <p>${escapeHtml(record.services)}</p>
            <div class="form-actions">
              <a class="btn" href="tel:${escapeHtml(record.phone).replaceAll("-", "")}">電話で問い合わせ</a>
              <a class="btn secondary" href="${escapeHtml(record.website || record.qrUrl || "#")}" target="_blank" rel="noreferrer">Webサイトを見る</a>
            </div>
            <dl>
              <dt>住所</dt><dd>${escapeHtml(record.address)}</dd>
              <dt>電話番号</dt><dd>${escapeHtml(record.phone)}</dd>
              <dt>WebサイトURL</dt><dd>${escapeHtml(record.website)}</dd>
              <dt>紙面掲載号</dt><dd>${escapeHtml(record.issue)}</dd>
              <dt>特集名</dt><dd>${escapeHtml(record.feature)}</dd>
              <dt>紙面掲載枠</dt><dd>${escapeHtml(record.adSize)}</dd>
            </dl>
          </div>
        </article>
      `;
      previewPanel.classList.add("open");
    }

    function upsertRecord(record) {
      const index = records.findIndex(item => item.id === record.id);
      if (index >= 0) {
        records[index] = record;
      } else {
        records.unshift(record);
      }
      saveRecords();
      renderRows();
      setFormRecord(record);
      renderPreview(record);
    }

    function deleteRecord(id) {
      const record = records.find(item => item.id === id);
      if (!record) return;
      if (!confirm(`${record.companyName} を削除しますか？`)) return;
      records = records.filter(item => item.id !== id);
      saveRecords();
      renderRows();
      clearForm();
    }

    function exportCsv() {
      const header = fields;
      const data = filteredRecords();
      const lines = [header, ...data.map(record => header.map(field => record[field] || ""))]
        .map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(","));
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `life-news-companies-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      upsertRecord(getFormRecord());
    });

    rows.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const record = records.find(item => item.id === button.dataset.id);
      if (!record) return;
      if (button.dataset.action === "edit") setFormRecord(record);
      if (button.dataset.action === "preview") {
        setFormRecord(record);
        renderPreview(record);
      }
      if (button.dataset.action === "delete") deleteRecord(record.id);
    });

    document.getElementById("newButton").addEventListener("click", clearForm);
    document.getElementById("clearButton").addEventListener("click", clearForm);
    document.getElementById("previewButton").addEventListener("click", () => renderPreview(getFormRecord()));
    document.getElementById("deleteButton").addEventListener("click", () => {
      const id = document.getElementById("id").value;
      if (id) deleteRecord(id);
    });
    document.getElementById("exportButton").addEventListener("click", exportCsv);
    document.getElementById("sampleButton").addEventListener("click", () => {
      if (!confirm("現在のローカル保存データをサンプルに戻しますか？")) return;
      records = samples.map(item => ({ ...item, id: crypto.randomUUID() }));
      saveRecords();
      renderRows();
      clearForm();
    });
    categoryFilter.addEventListener("change", renderRows);
    searchInput.addEventListener("input", renderRows);

    fillSelects();
    renderRows();
    clearForm();
  </script>
</body>
</html>
